      operationId: GetSubscriptionByUIds
      summary: Get a specific subscription by Multiple unique Id
      description: Get a specific subscription by Multiple unique Id.
      parameters:
      - name: destination
        in: query
        required: false
        description: The destination filter for subscriptions, default is all. (tsdb, datalake, all).
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UidPostRequest'
            example:
            - uId: string
          text/json:
