            example:
            - uId: string
          application/*+json:
            schema:
              $ref: '#/components/schemas/UidPostRequest-2'
            example:
            - uId: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsCompleteDto'
              example:
                data:
                  items:
                  - uId: string
                    timeseriesId: string
                    name: string
                    plantSapCode: 0
                    plantStidCode: string
                    terminal: string
                    fieldId: string
                    createdBy: string
                    created: string
