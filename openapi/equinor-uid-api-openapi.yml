                    tsdbBackfilled: true
                    tsdbEventsExported: 0
                    tsdbFirstExportedTime: string
                    tsdbLastExportedTime: string
                    dlExportEnabled: true
                    dlBackfilled: true
                    dlEventsExported: 0
