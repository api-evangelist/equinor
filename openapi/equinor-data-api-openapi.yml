  /{id}/data/aggregates:
    get:
      operationId: GetAggregatedData
      summary: Retrieves aggregated datapoints by id from a given time window and applied…
      description: Retrieves aggregated datapoints by id from a given time window and applied parameters.
      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries from which to retrieve data.
        schema:
          type: string
      - name: aggregateFunction
        in: query
        required: true
        description: 'Aggregation to apply to processing bins. Multiple simultaneous functions supported. Available values: [avg, min, max, sum, stddev, count, first, last, median]'
        schema:
          type: array
      - name: processingInterval
        in: query
        required: false
        description: The binning-interval for the aggregation. Must be smaller than total window size. If not given, then the aggregations are performed acrosss the entire time window. E.g. 1s, 5m, 10h, 20d.
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). Start of data window
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). End of data window
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filters on status value(s) if given.Should only be used when necessary due to performance penalty.Documentation of status codes https://github.com/equinor/OmniaPlant/wiki/Timeseries-Data
        schema:
          type: array
      - name: fill
        in: query
        required: false
        description: 'Determines how to fill empty bins. Available values: [null, none, forward, linear]. Default is none.'
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Format - int32. Limit of datapoints pr page in the result set. Between 1-100 000. For next page use continuationToken.
        schema:
          type: integer
      - name: continuationToken
        in: query
        required: false
        description: The continuationToken for next result set.
        schema:
          type: string
      - name: federationSource
        in: query
        required: false
        description: Determines whether or not the request should use federation as data source.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatapointsResponseDto'
              example:
                statusCode: 0
                message: string
                traceId: string
                data:
