  /{id}/data/first:
    get:
      operationId: GetFirst
      summary: Retrieves the first datapoint of a timeseries.
      description: Retrieves the first datapoint of a timeseries. When parameter 'afterTime' is included the first point immediately following this time is returned.
      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries from which to retrieve data.
        schema:
          type: string
      - name: afterTime
        in: query
        required: false
        description: Format - date-time(as date-time in RFC3339). Only look for points after this time(inclusive).
        schema:
          type: string
      - name: beforeTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). Only look for points before this time (exclusive).
        schema:
          type: string
      - name: status
