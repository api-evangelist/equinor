    get:
      operationId: GetData
      summary: Retrieves datapoints by id from a given time window, according to applied…
      description: Retrieves datapoints by id from a given time window, according to applied parameters.
      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries from which to retrieve data.
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). Start of data window
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). End of data window
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filters on status value(s) if given.Should only be used when necessary due to performance penalty.Documentation of status codes https://github.com/equinor/OmniaPlant/wiki/Timeseries-Data
        schema:
          type: array
      - name: limit
        in: query
        required: false
        description: Format - int32. Limit of datapoints pr page in the result set. Between 1-100 000. For next page use continuationToken.
        schema:
          type: integer
      - name: includeOutsidePoints
        in: query
        required: false
        description: Determines whether or not the points immediately prior to and following the time window should be included in result.
        schema:
          type: boolean
      - name: continuationToken
        in: query
        required: false
        description: The continuationToken for next result set.
        schema:
          type: string
      - name: federationSource
        in: query
        required: false
        description: Determines whether or not the request should use federation as data source.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDatapointsResponseDto'
              example:
                statusCode: 0
                message: string
                traceId: string
                data:
                  items:
                  - id: string
                    facility: string
                    name: string
                    terminal: string
                    datapoints:
                    - time: string
                      value: 10.3
                      status: 192
                    totalCount: 0
                    error: string
                    statusCode: 0
                continuationToken: string
