      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries for which to delete data.
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). Inclusive start bound of deletion window.
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). Non-inclusive end bound of deletion window.
        schema:
          type: string
