                  - id: string
                    facility: string
                    name: string
                    terminal: string
                    datapoints:
                    - time: string
                      value: 0
                      status: 0
                      count: 0
                      avg: 0
                      min: 0
                      max: 0
                      sum: 0
                      first: 0
                      last: 0
                      stddev: 0
                      median: 0
                    totalCount: 0
                    error: string
                    statusCode: 0
                continuationToken: string
            application/protobuf:
