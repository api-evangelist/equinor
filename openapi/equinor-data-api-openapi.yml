openapi: 3.2.0
info:
  title: Timeseries Data API
  description: This API returns information about Timeseries metadata and datapoints.
  contact:
    name: Omnia industrial IOT team
    email: OmniaIndIoT@equinor.com
  version: v1.7
servers:
- url: https://api.gateway.equinor.com/plant/timeseries
- url: https://api-ncc.gateway.equinor.com/plant/timeseries
security:
- {}
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Data
paths:
  /{id}/data:
    post:
      operationId: writeData
      summary: Adds or updates a timeseries' datapoints
      description: Adds or updates a timeseries' datapoints.
      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries for which to add or update datapoints
        schema:
          type: string
      - name: async
        in: query
        required: false
        description: "Determines whether the datapoints should be written asynchronoulsy. \n            If you set this to false, the request will not be returned until the changes are fully committed.\n            If you set this to true or do not supply it, the write will be enqueued and the request will return 202 Accepted."
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
            example:
              datapoints:
              - time: string
                value: 10.3
                status: 192
          text/json:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
            example:
              datapoints:
              - time: string
                value: 10.3
                status: 192
          application/*+json:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
            example:
              datapoints:
              - time: string
                value: 10.3
                status: 192
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
          application/protobuf:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
          application/x-google-protobuf:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageModel'
              example:
                statusCode: 0
                message: string
                traceId: string
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageModel'
              example:
                statusCode: 0
                message: string
                traceId: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageModel'
              example:
                statusCode: 0
                message: string
                traceId: string
        '404':
