openapi: 3.0.1
info:
  title: IMS Export Subscriptions API
  description: API for viewing and creating subscriptions. Subscriptions deliver data from plant IMS's to Omnia TSDB
  contact:
    name: PlantTeam
    email: OmniaIndIoT@equinor.com
  version: v1.2
servers:
- url: https://api.gateway.equinor.com/plant/ims-subscriptions
- url: https://api-ncc.gateway.equinor.com/plant/ims-subscriptions
paths:
  /:
    post:
      operationId: CreateSubscription
      summary: Create a new subscription.
      description: Create a new subscription.
      parameters:
      - name: destination
        in: query
        required: false
        description: The destination for subscription. Default is timeseries DB. (tsdb, datalake, all). Choosing tsdb as destination will create a subscription for datalake as well. The converse however, does not apply.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateModel'
            example:
              uId: string
              name: string
              systemId: string
              terminal: string
              backfillTo: string
          text/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateModel'
            example:
              uId: string
              name: string
              systemId: string
              terminal: string
              backfillTo: string
          application/*+json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateModel'
            example:
              uId: string
              name: string
              systemId: string
              terminal: string
              backfillTo: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsCompleteDto'
              example:
                data:
                  items:
                  - uId: string
                    timeseriesId: string
                    name: string
                    plantSapCode: 0
                    plantStidCode: string
                    terminal: string
                    fieldId: string
                    createdBy: string
                    created: string
                    tsdbExportEnabled: true
                    tsdbBackfilled: true
                    tsdbEventsExported: 0
                    tsdbFirstExportedTime: string
                    tsdbLastExportedTime: string
                    dlExportEnabled: true
                    dlBackfilled: true
                    dlEventsExported: 0
                    dlFirstExportedTime: string
                    dlLastExportedTime: string
                    dlParquetFirstExportedTime: string
                    dlParquetLastExportedTime: string
                    sourceFirstCountedTime: string
                    sourceLastCountedTime: string
                    rtLastExpirationDate: string
                errors: {}
                continuationToken: string
        '201':
          description: Created
