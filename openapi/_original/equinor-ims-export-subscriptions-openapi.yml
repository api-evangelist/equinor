  /realtime:
    post:
      operationId: CreateRealTimeSubscription
      summary: Create a real-time data subscription on ims system.
      description: Create a real-time data subscription on ims system.
      parameters:
      - name: lifeTime
        in: query
        required: false
        description: 'The lifetime of the real time subscription. The default is ''10m''. Max is ''35d''. Valid examples: 60s, 10m, 24h, 15d.'
        schema:
          type: string
      - name: expirationTime
        in: query
        required: false
        description: Format - date-time (as date-time in RFC3339). The expiration time of the subscription in utc time. Max is 35 days from request time. If given takes priority over 'lifetime' parameter.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateModel'
            example:
              uId: string
              name: string
              systemId: string
              terminal: string
              backfillTo: string
