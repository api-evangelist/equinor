  /{id}/data:
    post:
      operationId: writeData
      summary: Adds or updates a timeseries' datapoints.
      description: Adds or updates a timeseries' datapoints.
      parameters:
      - name: id
        in: path
        required: true
        description: Format - uuid. Id of timeseries for which to add or update datapoints
        schema:
          type: string
      - name: async
        in: query
        required: false
        description: "Determines whether the datapoints should be written asynchronoulsy. \r\n            If you set this to false, the request will not be returned until the changes are fully committed.\r\n            If you set this to true or do not supply it, the write will be enqueued and the request will return 202 Accepted."
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
            example:
              datapoints:
              - time: string
                value: 10.3
                status: 192
          text/json:
            schema:
              $ref: '#/components/schemas/DatapointsWriteRequestModel'
            example:
              datapoints:
              - time: string
                value: 10.3
                status: 192
          application/*+json:
