openapi: 3.2.0
info:
  title: StormGeo Allowed Locations API
  description: '# Introduction

    The StormGeo API exposes functionality related to the weather of predefined locations, or given coordinates.'
  version: v1
servers:
- url: https://api.gateway.equinor.com/stormgeo/v1
tags:
- name: Allowed Locations
paths:
  /allowed-locations:
    get:
      summary: Returns a list of locations for a specific vendor
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: null
                $ref: '#/components/schemas/Allowedlocations'
              examples:
                default:
                  value:
                    vendorname:
                    - LocationId: 0
                      Description: string
            application/json:
              schema:
                type: array
                items: null
                $ref: '#/components/schemas/Allowedlocations'
              example:
                vendorname:
                - LocationId: 0
                  Description: string
            text/json:
              schema:
                type: array
                items: null
                $ref: '#/components/schemas/Allowedlocations'
              example:
                vendorname:
                - LocationId: 0
                  Description: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
      - Allowed Locations
      operationId: getAllowedLocations
      x-operation-id-source: derived
components:
  schemas:
    Allowedlocations:
      type: object
      properties:
        LocationId:
          type: integer
          format: int32
        Description:
          type: string
      additionalProperties: false
