aid: equinor

name: Equinor

description: Equinor ASA is an international energy company headquartered in Norway, with around 25,000 employees and offices in more than 20
  countries (per equinor.com). It operates oil, gas, renewables and low-carbon businesses, runs a public Equinor API portal at api.equinor.com
  (built on Azure API Management) listing its APIs and products, publishes REST API guidelines in its api-strategy GitHub repository, shares open
  energy data, and maintains a large open-source presence at github.com/equinor.

