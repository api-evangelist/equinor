- name: azureAdOAuth2
  type: oauth2
  source: docs
  description: >-
    "The Omnia Timeseries API uses OAuth 2.0 and Azure AD as identity provider." Tested flows are Client Credentials Grant (service-to-service with shared secret) and Authorization Code (user impersonation, native/public client). Managed Service Identity is also supported for Equinor applications in Azure. Not declared as a securityScheme in the OpenAPI exports.
  flows:
  - clientCredentials
  - authorizationCode
  token_lifetime: >-
    access token "has an expiration time (e.g. 1 hour)"; the client must renew it.
  onboarding: Access is granted on request (OmniaIndIoT@equinor.com or ServiceNow request); roles/API permissions such as Timeseries.Read and AE.Read are assigned by the Omnia Ind IoT team.
